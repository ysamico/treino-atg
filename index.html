<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">

<title>Treino ATG</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: uma coluna de celular (máx. 560px), barra de abas fixa embaixo, tela de exercício sobreposta. */
:root {
  --bg: #EEF0EC; --surface: #FFFFFF; --sunk: #E3E7E2; --ink: #17201B; --muted: #5C6760; --line: #D3D9D3;
  --accent: #D99A00; --accent-soft: #F6E4AE; --accent-ink: #3B2A00;
  --fig: #17201B; --fig2: #A3ADA6; --equip: #C3CBC5; --load: #D99A00;
  --ok: #2E8A55; --danger: #B3362B;
  --p-red: #C9392C; --p-blue: #2B5FC4; --p-yellow: #D99A00; --p-green: #2E8A55; --p-white: #FFFFFF;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1311; --surface: #171E1A; --sunk: #202923; --ink: #E7ECE8; --muted: #95A198; --line: #2A342E;
  --accent: #F0B429; --accent-soft: #3A2F12; --accent-ink: #F7DE9C;
  --fig: #E7ECE8; --fig2: #5E6A63; --equip: #3A4640; --load: #F0B429; --ok: #4FBF7F; --danger: #E3695D;
  --p-white: #E7ECE8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1311; --surface: #171E1A; --sunk: #202923; --ink: #E7ECE8; --muted: #95A198; --line: #2A342E;
  --accent: #F0B429; --accent-soft: #3A2F12; --accent-ink: #F7DE9C;
  --fig: #E7ECE8; --fig2: #5E6A63; --equip: #3A4640; --load: #F0B429; --ok: #4FBF7F; --danger: #E3695D;
  --p-white: #E7ECE8; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }

/* Cabeçalho */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-inline: -16px; padding: 12px 16px 8px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font: 700 26px/1 var(--f-display); letter-spacing: .01em; margin: 0; text-transform: uppercase; }
.brand .date { color: var(--muted); font-size: 13px; }
.days { display: flex; gap: 6px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 4px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day-chip { flex: none; min-width: 58px; padding: 7px 10px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-align: center; }
.day-chip b { display: block; font: 700 17px/1 var(--f-display); text-transform: uppercase; }
.day-chip small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.day-chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day-chip[aria-pressed="true"] small { color: inherit; opacity: .75; }

.day-head { margin: 14px 0 12px; }
.day-head .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.day-head h2 { font: 700 30px/1.05 var(--f-display); margin: 2px 0 6px; text-wrap: balance; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.bar { flex: 1; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }

/* Blocos de superset */
.blocks { display: grid; gap: 12px; }
.block { background: var(--surface); border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
.block-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 4px; }
.plate { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 15px/1 var(--f-display); color: #fff; flex: none; box-shadow: inset 0 0 0 3px rgba(255,255,255,.22); }
.plate.p0 { background: var(--p-red); } .plate.p1 { background: var(--p-blue); } .plate.p2 { background: var(--p-yellow); color: #2a1e00; }
.plate.p3 { background: var(--p-green); } .plate.p4 { background: var(--p-white); color: #17201B; box-shadow: inset 0 0 0 2px #17201B33; }
.block-head .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.block-head .lbl b { color: var(--ink); letter-spacing: .04em; }
.row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px 12px; min-height: 64px; }
.row + .row { border-top: 1px solid var(--line); }
.row:active { background: var(--sunk); }
.thumb { width: 64px; height: 50px; border-radius: 8px; background: var(--sunk); overflow: hidden; }
.thumb svg { width: 100%; height: 100%; }
.row .info { min-width: 0; }
.row .nm { font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row .code { font: 700 13px/1 var(--f-display); color: var(--muted); }
.tag { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--sunk); color: var(--muted); font-weight: 600; }
.row .meta { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.row .last { font-size: 12.5px; color: var(--ink); margin-top: 2px; }
.row .last b { font-weight: 600; }
.status { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.status.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.status.part { border-color: var(--accent); }
.status svg { width: 14px; height: 14px; }

/* Tela de exercício */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top, 0px); }
.sheet-inner { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px)); }
.sheet-bar { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-inline: -16px; padding: 10px 16px; }
.back { display: flex; align-items: center; gap: 4px; font-weight: 600; min-height: 36px; padding-right: 8px; }
.back svg { width: 20px; height: 20px; }
.ss-pos { font: 700 15px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.stage svg.fig { display: block; width: 100%; height: auto; aspect-ratio: 240 / 187; max-width: 100%; }
.stage .pp { position: absolute; right: 10px; bottom: 10px; width: 36px; height: 36px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; }
.stage .pp svg { width: 16px; height: 16px; }
.ex-title { margin: 14px 0 2px; font: 700 30px/1.05 var(--f-display); text-wrap: balance; }
.ex-sub { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.ex-sub b { color: var(--ink); font-weight: 600; }

.tabs { display: flex; gap: 4px; margin: 16px 0 12px; background: var(--sunk); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; padding: 8px 4px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.stack { display: grid; gap: 12px; }
.h3 { font: 700 18px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Registro */
.prev { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.pill { background: var(--sunk); color: var(--ink); border-radius: 6px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.sets { display: grid; gap: 8px; margin-top: 12px; }
.set { display: grid; grid-template-columns: 34px 1fr 16px 1fr 44px; gap: 8px; align-items: center; }
.set .n { font: 700 20px/1 var(--f-display); color: var(--muted); text-align: center; }
.field { position: relative; }
.field input { width: 100%; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 700 22px/1 var(--f-display); text-align: center; padding: 0 30px 0 8px; font-variant-numeric: tabular-nums; -webkit-appearance: none; }
.field input::placeholder { color: var(--muted); opacity: .55; font-weight: 600; }
.field span { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--muted); pointer-events: none; }
.set .x { text-align: center; color: var(--muted); }
.chk { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.chk svg { width: 20px; height: 20px; }
.chk[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.set.done input { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.set-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn { min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.accent { background: var(--accent); color: #241900; border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 13px; }
.btn svg { width: 16px; height: 16px; }
.next-ss { width: 100%; margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-ink); text-align: left; }
.next-ss small { display: block; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.next-ss b { font: 700 20px/1.1 var(--f-display); }
.next-ss svg { width: 22px; height: 22px; flex: none; }
.rest { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.rest .lbl { font-size: 13px; color: var(--muted); margin-right: 2px; }

/* Como fazer */
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
ol.steps li::before { content: counter(s); font: 700 15px/26px var(--f-display); width: 26px; height: 26px; border-radius: 50%; background: var(--sunk); text-align: center; }
.cues { display: flex; flex-wrap: wrap; gap: 6px; }
.cue { background: var(--accent-soft); color: var(--accent-ink); border-radius: 8px; padding: 5px 9px; font-size: 13.5px; }
.link { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--accent); }

/* Variações */
.ladder { display: grid; gap: 8px; }
.rung { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 10px 0; }
.rung + .rung { border-top: 1px solid var(--line); }
.rung .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font: 700 15px/1 var(--f-display); }
.rung .ic.down { background: var(--sunk); color: var(--muted); }
.rung .ic.up { background: var(--accent); color: #241900; }
.rung b { display: block; }
.rung.cur { background: var(--sunk); border-radius: 10px; padding: 10px; margin: 2px -10px; border-top: 0; }
.rung.cur + .rung { border-top: 0; }

/* Histórico */
.seg { display: inline-flex; gap: 2px; background: var(--sunk); padding: 3px; border-radius: 9px; flex-wrap: wrap; }
.seg button { padding: 5px 9px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.chart { position: relative; margin-top: 10px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .12; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .endlbl { fill: var(--ink); font: 700 13px var(--f-display); }
.chart .hit { fill: transparent; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 8px; border-radius: 7px; white-space: nowrap; transform: translate(-50%, -115%); }
.hist-list { display: grid; gap: 0; margin-top: 8px; }
.hrow { display: grid; grid-template-columns: 76px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.hrow .d { color: var(--muted); font-variant-numeric: tabular-nums; }
.hrow .s { display: flex; flex-wrap: wrap; gap: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: var(--sunk); border-radius: 10px; padding: 8px 10px; }
.stat small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stat b { font: 700 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }

/* Progresso */
.plist { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 1fr 90px auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; }
.prow .nm { font-weight: 600; }
.prow svg { width: 90px; height: 30px; }
.prow .val { font: 700 20px/1 var(--f-display); text-align: right; font-variant-numeric: tabular-nums; }
.prow .val small { display: block; font: 400 11px var(--f-body); color: var(--muted); margin-top: 2px; }
.spark { fill: none; stroke: var(--accent); stroke-width: 2; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font: 700 20px/1.2 var(--f-display); margin-bottom: 4px; }

textarea { width: 100%; min-height: 110px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 10px; font: 12px/1.4 ui-monospace, Menlo, monospace; }
.note { font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }

/* Barra inferior + timer */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.nav-in { max-width: 560px; margin: 0 auto; display: flex; }
.nav button { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 4px 0; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-selected="true"] { color: var(--ink); }
.nav button[aria-selected="true"] svg { color: var(--accent); }
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 40; width: min(528px, calc(100% - 32px)); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.timer .t { font: 700 30px/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 72px; }
.timer .l { font-size: 12px; opacity: .75; flex: 1; }
.timer button { min-height: 38px; padding: 0 10px; border-radius: 9px; background: rgba(127,127,127,.25); font-weight: 600; font-size: 13px; }
.timer.over { background: var(--accent); color: #241900; }

/* Figura */
svg.fig .limb { fill: none; stroke: var(--fig); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
svg.fig .limb.far { stroke: var(--fig2); }
svg.fig .head { fill: var(--fig); }
svg.fig .ground { stroke: var(--equip); stroke-width: 2; }
svg.fig .eq { fill: var(--equip); }
svg.fig .eqline { stroke: var(--equip); stroke-linecap: round; }
svg.fig .load { fill: var(--load); }
svg.fig .loadline { fill: none; stroke: var(--load); stroke-width: 3; }
svg.fig .cable { stroke: var(--muted); stroke-width: 1.5; }
svg.fig .viewlbl { font: 600 9px var(--f-body); fill: var(--muted); letter-spacing: .03em; }
.thumb svg.fig .viewlbl { display: none; }
.thumb svg.fig .limb { stroke-width: 9; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
// ===== Biblioteca de exercícios =====
// m: 'reps' (carga × repetições) | 'time' (carga × segundos)
const EX = {
  // ---------- AQUECIMENTO ----------
  neck4: {
    name: '4 Way Neck Rotation', area: 'Pescoço', m: 'reps', rx: '1–2 × 10 por direção',
    steps: ['Em pé ou sentado, coluna neutra e ombros relaxados.', 'Leve o queixo ao peito e depois olhe para o teto, devagar.', 'Incline a orelha em direção a cada ombro.', 'Gire a cabeça olhando por cima de cada ombro.'],
    cues: ['Movimento lento e controlado, sem tranco', 'Ombros ficam baixos', 'Amplitude sem dor'],
    reg: [['Amplitude parcial', 'Só metade do caminho em cada direção.'], ['Deitado', 'Faça os movimentos deitado de costas, sem o peso da cabeça.']],
    prog: [['Resistência manual', 'Empurre a cabeça com a mão contra o movimento (isometria).'], ['Neck harness / anilha', 'Flexão e extensão com carga leve, deitado no banco.']],
    anim: 'neck', q: 'neck 4 way rotation warm up'
  },
  pump: {
    name: 'Pump Warm Up', area: 'Panturrilha / tibial', m: 'reps', rx: '2 × 20–30',
    steps: ['Em pé, apoiado levemente numa parede ou barra.', 'Suba na ponta dos pés (elevação de panturrilha).', 'Desça e levante a ponta dos pés, ficando sobre os calcanhares.', 'Alterne ritmado para "bombear" sangue nas pernas.'],
    cues: ['Ritmo contínuo', 'Joelhos estendidos mas não travados', 'Amplitude total em cima e embaixo'],
    reg: [['Sentado', 'Mesma alternância sentado numa cadeira.'], ['Amplitude menor', 'Movimentos curtos e rápidos.']],
    prog: [['Unilateral', 'Uma perna de cada vez.'], ['Com halteres', 'Segure halteres leves nas mãos.']],
    anim: 'pump', q: 'calf tibialis pump warm up'
  },
  sled: {
    name: 'Sled', area: 'Joelhos / quadríceps / condicionamento', m: 'reps', rx: '4–6 idas de 20 m (anote kg × metros)',
    steps: ['Segure as alças do trenó com os braços estendidos.', 'Ande de costas puxando o trenó (ou empurre para frente).', 'Passos curtos, pisando com a ponta do pé primeiro ao ir de costas.', 'Mantenha os joelhos passando da ponta dos pés.'],
    cues: ['Tronco levemente inclinado', 'Passos constantes', 'Sinta o quadríceps queimar, sem dor articular'],
    reg: [['Sem carga', 'Apenas o trenó vazio.'], ['Andar de costas', 'Sem trenó, em esteira ou chão.']],
    prog: [['Mais carga', 'Adicione anilhas aos poucos.'], ['Mais distância', 'Aumente os metros antes da carga.']],
    anim: 'sled', q: 'backwards sled drag knee warm up'
  },

// ===== Motor de animação: boneco articulado em SVG =====
// Ângulos de direção em graus: 0 = para baixo, 90 = para frente (direita), 180 = para cima, -90 = para trás.
const FIG = (() => {
  const L = { torso: 46, neck: 7, head: 9, thigh: 36, shin: 34, foot: 11, upper: 26, fore: 24 };
  const R = Math.PI / 180;
  const dir = (a, len) => [Math.sin(a * R) * len, Math.cos(a * R) * len];
  const add = (p, v) => [p[0] + v[0], p[1] + v[1]];
  const ang = (v) => Math.atan2(v[0], v[1]) / R;
  const GROUND = 165;
  const BASE = { x: 120, y: 91, t: 180, hd: null, c: 0, tl: 1, sh: 0, front: 0, ar: 0,
    tn: 0, sn: 0, fn: 90, tf: 0, sf: 0, ff: 90, un: 0, ln: 0, uf: 0, lf: 0, sln: 1, slf: 1, p: 0 };

  function ik(root, target, l1, l2, bend) {
    let v = [target[0] - root[0], target[1] - root[1]];
    let d = Math.hypot(v[0], v[1]);
    const dMin = Math.abs(l1 - l2) + 0.01, dMax = l1 + l2 - 0.01;
    const dc = Math.min(Math.max(d, dMin), dMax);
    const base = ang(v);
    const a = Math.acos(Math.min(1, Math.max(-1, (l1 * l1 + dc * dc - l2 * l2) / (2 * l1 * dc)))) / R;
    const a1 = base + bend * a;
    const j = add(root, dir(a1, l1));
    const end = d > 0 ? add(root, [v[0] / d * dc, v[1] / d * dc]) : add(j, dir(a1, l2));
    return [a1, ang([end[0] - j[0], end[1] - j[1]])];
  }

  function resolveTarget(tg, pts) {
    if (typeof tg[0] === 'string') { const b = pts[tg[0]]; return [b[0] + tg[1], b[1] + tg[2]]; }
    return tg;
  }

  // Calcula todos os pontos de uma pose
  function solve(ps) {
    const P = {};
    const hw = ps.front ? 9 : 0, sw = ps.front ? 13 : 0;
    const build = (H) => {
      P.H = H;
      P.N = add(H, dir(ps.t, L.torso * ps.tl));
      P.Hd = add(P.N, dir(ps.hd == null ? ps.t : ps.hd, L.neck + L.head));
      P.S = [P.N[0] + sw, P.N[1] - ps.sh];
      P.Sf = [P.N[0] - sw, P.N[1] - ps.sh];
      P.Hn = [H[0] + hw, H[1]];
      P.Hf = [H[0] - hw, H[1]];
      const off = ps.ar ? ps.t - 180 : 0;
      if (!ps.kn) legFK('n', ps.tn, ps.sn, ps.sln);
      if (!ps.kf) legFK('f', ps.tf, ps.sf, ps.slf);
      if (!ps.wn) armFK('n', ps.un + off, ps.ln + off);
      if (!ps.wf) armFK('f', ps.uf + off, ps.lf + off);
    };
    const legFK = (s, a1, a2, sl) => {
      const h = s === 'n' ? P.Hn : P.Hf;
      P['K' + s] = add(h, dir(a1, L.thigh));
      P['A' + s] = add(P['K' + s], dir(a2, L.shin * sl));
    };
    const armFK = (s, a1, a2) => {
      const sp = s === 'n' ? P.S : P.Sf;
      P['E' + s] = add(sp, dir(a1, L.upper));
      P['W' + s] = add(P['E' + s], dir(a2, L.fore));
    };
    build([0, 0]);
    let H = [ps.x, ps.y];
    if (ps.anc) { const q = P[ps.anc[0]]; H = [ps.anc[1] - q[0], ps.anc[2] - q[1]]; }
    build(H);
    // IK depois (alvos podem referenciar outros pontos)
    if (ps.kn) { const [a, b] = ik(P.Hn, resolveTarget(ps.kn, P), L.thigh, L.shin * ps.sln, ps.bkn ?? 1); legFK('n', a, b, ps.sln); }
    if (ps.kf) { const [a, b] = ik(P.Hf, resolveTarget(ps.kf, P), L.thigh, L.shin * ps.slf, ps.bkf ?? 1); legFK('f', a, b, ps.slf); }
    if (ps.wn) { const [a, b] = ik(P.S, resolveTarget(ps.wn, P), L.upper, L.fore, ps.bwn ?? -1); armFK('n', a, b); }
    if (ps.wf) { const [a, b] = ik(P.Sf, resolveTarget(ps.wf, P), L.upper, L.fore, ps.bwf ?? -1); armFK('f', a, b); }
    P.Tn = add(P.An, dir(ps.fn, L.foot));
    P.Tf = add(P.Af, dir(ps.ff, L.foot));
    P.Wm = [(P.Wn[0] + P.Wf[0]) / 2, (P.Wn[1] + P.Wf[1]) / 2];
    P.Km = [(P.Kn[0] + P.Kf[0]) / 2, (P.Kn[1] + P.Kf[1]) / 2];
    // curvatura da coluna
    const v = [P.N[0] - H[0], P.N[1] - H[1]], len = Math.hypot(v[0], v[1]) || 1;
    const perp = [v[1] / len, -v[0] / len];
    P.C = [(H[0] + P.N[0]) / 2 + perp[0] * ps.c * 2, (H[1] + P.N[1]) / 2 + perp[1] * ps.c * 2];
    P._p = ps.p;
    return P;
  }

  const lerp = (a, b, k) => a + (b - a) * k;
  function lerpVal(a, b, k) {
    if (typeof a === 'number' && typeof b === 'number') return lerp(a, b, k);
    if (Array.isArray(a) && Array.isArray(b)) {
      if (typeof a[0] === 'string') return a[0] === b[0] ? [a[0], lerp(a[1], b[1], k), lerp(a[2], b[2], k)] : (k < .5 ? a : b);
      return [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
    }
    return k < .5 ? a : b;
  }
  function blend(A, B, k) {
    const o = {};
    for (const key in A) o[key] = lerpVal(A[key], B[key], k);
    if (A.hd == null || B.hd == null) o.hd = null;
    if (A.anc && B.anc) o.anc = A.anc[0] === B.anc[0] ? [A.anc[0], lerp(A.anc[1], B.anc[1], k), lerp(A.anc[2], B.anc[2], k)] : (k < .5 ? A.anc : B.anc);
    return o;
  }

  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const pl = (...pts) => pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

  function drawProps(g, props, P, layer) {
    g.textContent = '';
    for (const pr of props) {
      if ((pr.layer || (pr.at || pr.to ? 'front' : 'back')) !== layer) continue;
      const at = pr.at ? P[pr.at] : null;
      switch (pr.k) {
        case 'rect': el('rect', { x: pr.x, y: pr.y, width: pr.w, height: pr.h, rx: pr.r ?? 2, class: pr.cls || 'eq' }, g); break;
        case 'poly': el('polygon', { points: pl(...pr.pts), class: pr.cls || 'eq' }, g); break;
        case 'line': el('line', { x1: pr.x1, y1: pr.y1, x2: pr.x2, y2: pr.y2, class: 'eqline', 'stroke-width': pr.w || 3 }, g); break;
        case 'db': {
          const [x, y] = [at[0] + (pr.dx || 0), at[1] + (pr.dy || 0)];
          el('rect', { x: x - 7, y: y - 4.5, width: 14, height: 9, rx: 3, class: 'load' }, g); break;
        }
        case 'kb': {
          const [x, y] = [at[0], at[1] + 7];
          el('circle', { cx: x, cy: y, r: 8, class: 'load' }, g);
          el('path', { d: `M${x - 5},${y - 5} Q${x},${y - 14} ${x + 5},${y - 5}`, class: 'loadline' }, g); break;
        }
        case 'plate': el('circle', { cx: at[0] + (pr.dx || 0), cy: at[1] + (pr.dy || 0), r: pr.r || 10, class: 'load' }, g); break;
        case 'ball': { const r = (pr.r || 7) * (1 - 0.15 * P._p); el('ellipse', { cx: at[0] + (pr.dx || 0), cy: at[1] + (pr.dy || 0), rx: r, ry: pr.r || 7, class: 'load' }, g); break; }

      torso.setAttribute('d', `M${P.H[0].toFixed(1)},${P.H[1].toFixed(1)} Q${P.C[0].toFixed(1)},${P.C[1].toFixed(1)} ${P.N[0].toFixed(1)},${P.N[1].toFixed(1)}`);

      play() { if (running || reduce) return; running = true; t0 = performance.now(); raf = requestAnimationFrame(loop); },
      stop() { running = false; cancelAnimationFrame(raf); },
      frame(i) { at(seg * i); }
    };

  function paneLog(pane, id, e, partner, goPartner) {

        </div>
      </div>
      <div class="card" style="margin-top:12px"><div class="h3">Sessões</div><div class="hist-list">
        ${hs.slice().reverse().map(x => `<div class="hrow"><span class="d">${fmtDate(x.date)}</span><span class="s">${x.sets.map(s => `<span class="pill">${setStr(s, e.m)}</span>`).join('')}</span><button class="btn sm ghost danger" data-del="${x.date}">Apagar</button></div>`).join('')}
      </div></div>`;
      pane.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mk = b.dataset.m; drawIt(); });
      pane.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
        if (b.dataset.confirm) { delete S.logs[b.dataset.del][id]; if (!Object.keys(S.logs[b.dataset.del]).length) delete S.logs[b.dataset.del]; save(); paneHist(pane, id, e); toast('Sessão apagada'); }
        else { b.dataset.confirm = 1; b.textContent = 'Confirmar?'; setTimeout(() => { if (b.isConnected) { delete b.dataset.confirm; b.textContent = 'Apagar'; } }, 3000); }
      });
      lineChart($('#chart', pane), pts, m[2]);
    };
    drawIt();
  }

  function niceTicks(min, max, n = 4) {
    if (min === max) { min = min - 1; max = max + 1; }
    const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || 10 * mag;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
    const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 1000) / 1000);
    return ticks;
  }
  function lineChart(host, pts, unit) {
    const W = 320, H = 170, L = 34, R = 34, T = 14, B = 24;
    const vals = pts.map(p => p.v);
    const ticks = niceTicks(Math.min(...vals), Math.max(...vals));
    const lo = ticks[0], hi = ticks[ticks.length - 1];
    const x = i => pts.length === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (pts.length - 1);
    const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo || 1));
    const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
    const area = pts.length > 1 ? `${path}L${x(pts.length - 1)},${H - B}L${x(0)},${H - B}Z` : '';
    const lp = pts[pts.length - 1];
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução">
      ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${fmtN(t)}</text>`).join('')}
      ${area ? `<path class="area" d="${area}"/>` : ''}
      <path class="ln" d="${path}"/>
      ${pts.map((p, i) => `<circle class="dot" cx="${x(i)}" cy="${y(p.v)}" r="${i === pts.length - 1 ? 5 : 4}"/>`).join('')}
      <text class="endlbl" x="${x(pts.length - 1) + 8}" y="${y(lp.v) + 4}">${fmtN(Math.round(lp.v * 10) / 10)}</text>
      <text class="axis" x="${x(0)}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}">${fmtDate(pts[0].date)}</text>
      ${pts.length > 1 ? `<text class="axis" x="${x(pts.length - 1)}" y="${H - 6}" text-anchor="end">${fmtDate(lp.date)}</text>` : ''}
      ${pts.map((p, i) => `<rect class="hit" data-i="${i}" x="${x(i) - 14}" y="${T}" width="28" height="${H - T - B}"/>`).join('')}
    </svg>`;
    const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; host.appendChild(tip);
    host.querySelectorAll('.hit').forEach(r => {
      const show = () => {
        const i = +r.dataset.i, p = pts[i], box = host.getBoundingClientRect(), sc = box.width / W;
        tip.innerHTML = `<b>${fmtDate(p.date)}</b> · ${fmtN(Math.round(p.v * 10) / 10)} ${unit}`;
        tip.style.left = Math.min(Math.max(x(i) * sc, 60), box.width - 60) + 'px'; tip.style.top = y(p.v) * sc + 'px'; tip.hidden = false;
      };
      r.addEventListener('pointerenter', show); r.addEventListener('pointerdown', show);
      r.addEventListener('pointerleave', () => tip.hidden = true);
    });
  }

  // ---------- Progresso ----------
  function renderProgresso() {
    const ids = Object.keys(EX).filter(id => history(id).length);
    const rows = ids.map(id => { const hs = history(id); return { id, hs, last: hs[hs.length - 1].date }; }).sort((a, b) => b.last.localeCompare(a.last));
    main.innerHTML = `<header class="top"><div class="brand"><h1>Progresso</h1><span class="date">${rows.length} exercícios</span></div></header>
      ${rows.length ? `<div class="plist">${rows.map(r => {
        const mk = defaultMetric(r.id); const e = EX[r.id]; const unit = METRICS[e.m].find(x => x[0] === mk)[2];
        const vs = r.hs.map(x => metric(x.sets, mk)); const mn = Math.min(...vs), mx = Math.max(...vs);
        const sp = vs.map((v, i) => `${vs.length === 1 ? 45 : 2 + 86 * i / (vs.length - 1)},${(26 - 22 * (mx === mn ? .5 : (v - mn) / (mx - mn))).toFixed(1)}`).join(' ');
        return `<button class="prow" data-id="${r.id}"><span><span class="nm">${esc(e.name)}</span><br><span class="small muted">${r.hs.length} ${r.hs.length > 1 ? 'sessões' : 'sessão'} · última ${fmtDate(r.last)}</span></span>
          <svg viewBox="0 0 90 30" aria-hidden="true"><polyline class="spark" points="${sp}"/></svg>
          <span class="val">${fmtN(Math.round(vs[vs.length - 1] * 10) / 10)}<small>${mk === 'max' ? 'kg máx' : mk === 'secs' ? 's máx' : 'reps máx'}</small></span></button>`;
      }).join('')}</div>` : `<div class="card empty"><b>Nada registrado ainda</b>Abra um exercício na aba Treino e anote carga e repetições. A evolução aparece aqui.</div>`}`;
    main.querySelectorAll('.prow').forEach(b => b.onclick = () => {
      const id = b.dataset.id;
      const day = PROGRAM.find(d => d.items.some(x => x[0] === id));
      const gs = groups(day); let code = '1';
      gs.forEach((g, gi) => g.items.forEach((it, j) => { if (it.id === id) code = g.circuit ? String(j + 1) : LETTERS[gi] + (j + 1); }));
      sheetTab = 'hist'; openSheet(day.id, id, code, true);
    });
  }

  // ---------- Dados ----------
  function renderDados() {
    const nDays = Object.keys(S.logs).length;
    main.innerHTML = `<header class="top"><div class="brand"><h1>Dados</h1><span class="date">${nDays} ${nDays === 1 ? 'dia' : 'dias'} registrados</span></div></header>
    <div class="stack">
      <div class="card"><div class="h3">Backup</div>
        <p class="note" style="margin:0 0 10px">Os registros ficam só neste aparelho. Faça um backup de vez em quando, principalmente antes de trocar de celular ou apagar dados do navegador.</p>
        <div class="set-actions" style="margin-top:0">${window.__PWA__ ? '<button class="btn primary" id="dl">Baixar arquivo</button>' : ''}<button class="btn${window.__PWA__ ? '' : ' primary'}" id="cpy">Copiar texto</button></div>
      </div>
      <div class="card"><div class="h3">Restaurar</div>
        <p class="note" style="margin:0 0 10px">Escolha um arquivo de backup ou cole o texto copiado. Os registros são mesclados com os atuais.</p>
        <input type="file" id="file" accept=".json,application/json,text/plain" hidden>
        <div class="set-actions" style="margin-top:0"><button class="btn" id="pick">Escolher arquivo</button></div>
        <textarea id="paste" placeholder="Ou cole o backup aqui" style="margin-top:10px"></textarea>
        <div class="set-actions"><button class="btn" id="imp">Importar texto colado</button></div>
      </div>
      <div class="card"><div class="h3">Usar sem internet no iPhone</div>
        <ol class="steps small">
          <li><span>Abra a versão instalável do app no Safari (o link que você hospedou).</span></li>
          <li><span>Toque em Compartilhar e depois em <b>Adicionar à Tela de Início</b>.</span></li>
          <li><span>Abra pelo ícone uma vez com internet. Depois disso ele funciona offline, e o iOS não apaga os registros.</span></li>
        </ol>
      </div>
      <div class="card"><div class="h3">Tela ligada</div>
        <p class="note" style="margin:0">Enquanto um exercício está aberto, o app pede para a tela não apagar (quando o aparelho permite).</p></div>
      <div class="card"><div class="h3">Apagar tudo</div>
        <p class="note" style="margin:0 0 10px">Remove todos os registros deste aparelho. Não dá para desfazer.</p>
        <button class="btn danger" id="clr">Apagar todos os registros</button></div>
    </div>`;
    const payload = () => JSON.stringify({ app: 'treino-atg', exported: new Date().toISOString(), logs: S.logs });
    if ($('#dl')) $('#dl').onclick = () => {
      try {
        const blob = new Blob([payload()], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `treino-backup-${today()}.json`;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast('Backup gerado');
      } catch (e) { toast('Não foi possível baixar. Use Copiar texto.'); }
    };
    $('#cpy').onclick = () => {
      const txt = payload();
      const fallback = () => { const ta = $('#paste'); ta.value = txt; ta.focus(); ta.select(); toast('Texto selecionado. Copie manualmente.'); };
      try { navigator.clipboard.writeText(txt).then(() => toast('Backup copiado'), fallback); } catch (e) { fallback(); }
    };
    const merge = (txt) => {
      try {
        const d = JSON.parse(txt); const logs = d.logs || d; let n = 0;
        for (const date in logs) { if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue; S.logs[date] = S.logs[date] || {}; for (const id in logs[date]) { if (!EX[id] || !Array.isArray(logs[date][id])) continue; S.logs[date][id] = logs[date][id]; n++; } }
        save(); toast(`${n} registros importados`); renderDados();
      } catch (e) { toast('Arquivo inválido. Confira se é um backup deste app.'); }
    };
    $('#pick').onclick = () => $('#file').click();
    $('#file').onchange = ev => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => merge(r.result); r.readAsText(f); };
    $('#imp').onclick = () => { const v = $('#paste').value.trim(); if (v) merge(v); else toast('Cole o texto do backup primeiro'); };
    const clr = $('#clr');
    clr.onclick = () => {
      if (clr.dataset.confirm) { S.logs = {}; save(); toast('Registros apagados'); renderDados(); }
      else { clr.dataset.confirm = 1; clr.textContent = 'Toque de novo para confirmar'; setTimeout(() => { if (clr.isConnected) { delete clr.dataset.confirm; clr.textContent = 'Apagar todos os registros'; } }, 4000); }
    };
  }

  // ---------- Timer de descanso ----------
  let timerEl = null, timerEnd = 0, timerInt = 0, actx = null;
  function beep() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      [0, .25, .5].forEach(off => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.25, actx.currentTime + off); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + off + .2); o.connect(g).connect(actx.destination); o.start(actx.currentTime + off); o.stop(actx.currentTime + off + .21); });
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  function startTimer(sec) {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch (e) {}
    timerEnd = Date.now() + sec * 1000;
    if (!timerEl) {
      timerEl = h(`<div class="timer" role="timer" aria-live="off"><span class="t num"></span><span class="l">Descanso</span><button id="tp">+15s</button><button id="tx">Fechar</button></div>`);
      document.body.appendChild(timerEl);
      $('#tp', timerEl).onclick = () => { timerEnd = Math.max(timerEnd, Date.now()) + 15000; timerEl.classList.remove('over'); timerEl.dataset.beeped = ''; tick(); };
      $('#tx', timerEl).onclick = stopTimer;
    }
    timerEl.classList.remove('over'); timerEl.dataset.beeped = '';
    clearInterval(timerInt); timerInt = setInterval(tick, 250); tick();
  }
  function tick() {
    const left = Math.round((timerEnd - Date.now()) / 1000);
    const a = Math.abs(left);
    $('.t', timerEl).textContent = (left < 0 ? '+' : '') + Math.floor(a / 60) + ':' + pad(a % 60);
    $('.l', timerEl).textContent = left <= 0 ? 'Bora! Próxima série' : 'Descanso';
    if (left <= 0 && !timerEl.dataset.beeped) { timerEl.dataset.beeped = 1; timerEl.classList.add('over'); beep(); }
  }
  function stopTimer() { clearInterval(timerInt); if (timerEl) timerEl.remove(); timerEl = null; }

  // ---------- Tela ligada ----------
  let lock = null;
  async function wake() { try { if ('wakeLock' in navigator && (!lock || lock.released)) lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && sheet) wake(); });

  renderMain();

  // Service worker (versão instalável)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.__PWA__) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();

</script>
</body></html>
